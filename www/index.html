<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أول دين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7684;--pr:#0f766e;--red:#c0392b;--grn:#15803d;--bd:#e3e7ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mut:#93a0ae;--pr:#2dd4bf;--red:#f87171;--grn:#4ade80;--bd:#2a3541;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mut:#93a0ae;--pr:#2dd4bf;--red:#f87171;--grn:#4ade80;--bd:#2a3541;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,Arial,sans-serif;min-height:100%;padding-bottom:96px}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:18px 0 8px;color:var(--mut)}small{color:var(--mut)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .sp{flex:1}
.ic{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;width:42px;height:42px;font-size:20px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(15,60,55,.07)}
.big{display:flex;justify-content:space-between;align-items:center}.big b{font-size:24px}
.neg{color:var(--red)}.ok{color:var(--grn)}
input,select{width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.row{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;color:#fff;font-size:16px;background:var(--pr)}
.btn.red{background:var(--red)}.btn.grn{background:var(--grn)}.btn.gray{background:var(--mut)}
.link{background:none;border:0;color:var(--red);font:inherit;padding:12px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.item b{display:block}.item .amt{font-weight:700;white-space:nowrap}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tx button{border:0;background:none;color:var(--mut);font-size:18px;padding:6px}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,#14907f,#0b5f57);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(15,118,110,.5);outline:4px solid rgba(212,165,55,.55)}
#sheet,#esheet,#osheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden],#esheet[hidden],#osheet[hidden]{display:none}
#sheet>div,#esheet>div,#osheet>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}
#toast[hidden]{display:none}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
body{background-image:radial-gradient(circle at 100% 0,rgba(20,144,127,.14),transparent 45%)}
.hero{background:linear-gradient(135deg,#083f3b,#14907f);color:#fff;border-radius:22px;padding:18px 20px;margin-bottom:14px;box-shadow:0 8px 22px rgba(15,118,110,.35);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08);top:-60px;inset-inline-start:-40px}
.hero span{opacity:.88;font-size:14px}.hero b{display:block;font-size:32px;margin-top:4px}
.hero .gold{height:4px;width:56px;background:#d4a537;border-radius:4px;margin-top:10px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}.brand .sp{flex:1}.brand small{display:block}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid #d4a537;color:#0b4f4a;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.2);flex:none}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:21px;flex:none}
.item .mid{flex:1;min-width:0}.item .mid b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{padding:6px 12px;border-radius:20px;font-weight:700;font-size:14px;white-space:nowrap}
.pill.neg{background:rgba(192,57,43,.13)}.pill.ok{background:rgba(21,128,61,.13)}
.item:active{transform:scale(.98)}
.office{background:linear-gradient(135deg,#083f3b,#14907f);color:#fff;text-align:center;padding:11px 12px 13px;border-radius:16px;margin-bottom:14px;border-bottom:4px solid #d4a537;box-shadow:0 4px 12px rgba(15,118,110,.3)}.office b{display:block;font-size:19px}.office small{color:rgba(255,255,255,.82);font-size:12px}
.lgb{display:block;height:96px;width:auto;margin:2px auto 6px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}.lgs{display:block;height:46px;width:auto;margin:0 auto 4px}
.office.row{display:flex;align-items:center;gap:14px;text-align:start;padding:10px 14px}.office.row .lgb{margin:0;height:80px;flex:none}.office.row .lgs{margin:0;height:46px;flex:none}.office.row>div{flex:1;min-width:0;padding-inline-end:30px}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:18px}
.office{position:relative}.oe{position:absolute;top:6px;inset-inline-end:6px;background:rgba(255,255,255,.18);border:0;border-radius:10px;color:#fff;width:32px;height:32px;font-size:14px}
.tx.debt{border-inline-start:5px solid var(--red)}.tx.pay{border-inline-start:5px solid var(--grn)}
#srch{border-radius:24px;padding:13px 18px;margin-bottom:12px}
.btn{border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
#sheet>div,#esheet>div,#osheet>div{animation:up .25s ease}.card,.hero{animation:fade .3s ease}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden><div>
<h2 style="margin-top:0">إضافة اسم جديد</h2>
<input id="pn" placeholder="اسم المديون">
<input id="po" placeholder="صاحب الدين">
<div class="row"><button class="btn" data-a="savep">حفظ</button><button class="btn gray" data-a="closesheet">إلغاء</button></div>
</div></div>
<div id="esheet" hidden><div>
<h2 style="margin-top:0">تعديل الحركة</h2>
<select id="et"><option value="debt">دين</option><option value="pay">تسديد</option></select>
<input id="ea" type="number" inputmode="decimal" placeholder="المبلغ">
<input id="en" placeholder="ملاحظة (اختياري)">
<div class="row"><button class="btn" data-a="saveedit">حفظ التعديل</button><button class="btn gray" data-a="closeedit">إلغاء</button></div>
</div></div>
<div id="osheet" hidden><div>
<h2 style="margin-top:0">تعديل بيانات المكتب</h2>
<input id="on" placeholder="اسم المكتب">
<input id="oa" placeholder="العنوان">
<input id="op" inputmode="tel" placeholder="رقم الهاتف">
<div class="row"><button class="btn" data-a="saveo">حفظ</button><button class="btn gray" data-a="closeo">إلغاء</button></div>
</div></div>
<div id="toast" hidden></div>

const K='awwal_deen_v1';let D=[];
try{D=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){D=[]}
const store=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
let O={n:'مكتب حسام للطباعة والاستنساخ',a:'سامراء – حي المعتصم',p:'07712151775'};
try{Object.assign(O,JSON.parse(localStorage.getItem('awwal_deen_office')||'{}'))}catch(e){}
const storeO=()=>{try{localStorage.setItem('awwal_deen_office',JSON.stringify(O))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const bal=p=>p.tx.reduce((s,x)=>s+(x.t==='debt'?x.a:-x.a),0);
let cur=null,q='',armed='',editIdx=-1;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2500)}

function render(){
  const A=$('#app');
  if(cur){
    const p=D.find(x=>x.id===cur);if(!p){cur=null;return render()}
    const b=bal(p);
    A.innerHTML=`<div class="office row"><img class="lgs" src="${LOGO}" alt=""><div><b>${esc(O.n)}</b></div></div><div class="top"><button class="ic" data-a="back">→</button><div><h1>${esc(p.name)}</h1><small>صاحب الدين: ${esc(p.owner||'—')}</small></div><span class="sp"></span><button class="ic" data-a="ppdf" title="تصدير كشف PDF" aria-label="تصدير كشف PDF">📄</button></div>
    <div class="hero"><span>المتبقي</span><b>${fmt(b)} د.ع</b><div class="gold"></div><span style="display:block;margin-top:8px">دين: ${fmt(p.tx.filter(x=>x.t==='debt').reduce((s,x)=>s+x.a,0))} · مسدد: ${fmt(p.tx.filter(x=>x.t==='pay').reduce((s,x)=>s+x.a,0))}</span></div>
    <div class="card"><input id="amt" type="number" inputmode="decimal" placeholder="المبلغ"><input id="note" placeholder="ملاحظة (اختياري)">
    <div class="row"><button class="btn red" data-a="debt">+ إضافة دين</button><button class="btn grn" data-a="pay">− تسديد</button></div></div>
    <h2>السجل</h2>
    ${p.tx.length?p.tx.map((x,i)=>`<div class="card tx ${x.t}"><div><b class="${x.t==='debt'?'neg':'ok'}">${x.t==='debt'?'دين':'تسديد'}: ${fmt(x.a)} د.ع</b><br><small>${esc(x.d)}${x.n?' · '+esc(x.n):''}</small></div><span><button data-a="edtx" data-i="${i}" aria-label="تعديل">✏️</button><button data-a="deltx" data-i="${i}" aria-label="حذف">🗑</button></span></div>`).reverse().join(''):'<div class="empty">لا توجد حركات بعد</div>'}
    <button class="link" data-a="delp">حذف هذا الاسم</button>`;
    return;
  }
  const list=D.filter(p=>(p.name+' '+p.owner).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const tot=D.reduce((s,p)=>s+Math.max(bal(p),0),0);
  A.innerHTML=`<div class="office row"><button class="oe" data-a="eoffice" aria-label="تعديل اسم المكتب">✏️</button><img class="lgb" src="${LOGO}" alt=""><div><b>${esc(O.n)}</b><small>${esc([O.a,O.p].filter(Boolean).join(' · '))}</small></div></div><div class="brand"><div><h1>أول دين</h1><small>سجل الديون</small></div><span class="sp"></span><button class="ic" data-a="pdf" title="تصدير PDF" aria-label="تصدير PDF">📄</button></div>
  <div class="hero"><span>إجمالي الديون المتبقية</span><b>${fmt(tot)} د.ع</b><div class="gold"></div><span style="display:block;margin-top:8px">${D.length} اسم مسجّل</span></div>
  <input id="srch" placeholder="بحث بالاسم…" value="${esc(q)}">
  ${list.length?list.map(p=>{const b=bal(p);return `<div class="card item" data-a="open" data-id="${p.id}"><div class="av" style="background:hsl(${[...p.name].reduce((h,c)=>h+c.charCodeAt(0),0)%360} 45% 42%)">${esc([...p.name][0])}</div><div class="mid"><b>${esc(p.name)}</b><small>صاحب الدين: ${esc(p.owner||'—')}</small></div><span class="pill ${b>0?'neg':'ok'}">${fmt(b)} د.ع</span></div>`}).join(''):`<div class="empty">${D.length?'لا نتائج':'لا توجد أسماء بعد.<br>اضغط + لإضافة أول مديون'}</div>`}
  <div class="foot">${esc(O.n)}</div>
  <button class="fab" data-a="add" aria-label="إضافة">+</button>`;
  const s=$('#srch');if(s)s.oninput=()=>{q=s.value;const pos=s.selectionStart;render();const n=$('#srch');n.focus();n.setSelectionRange(pos,pos)};
}

function twice(key,t,label){
  if(armed===key)return true;
  armed=key;const old=t.textContent;t.textContent=label;
  setTimeout(()=>{if(armed===key){armed='';t.textContent=old}},3000);return false;
}
function addTx(type){
  const p=D.find(x=>x.id===cur);const a=parseFloat($('#amt').value);
  if(!(a>0)){toast('أدخل مبلغًا صحيحًا');return}
  p.tx.push({t:type,a,n:$('#note').value.trim(),d:new Date().toLocaleDateString('en-GB')});
  store();render();toast(type==='debt'?'تمت إضافة الدين':'تم تسجيل التسديد');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='open'){cur=t.dataset.id;render();window.scrollTo(0,0)}
  else if(a==='back'){cur=null;render()}
  else if(a==='add'){$('#pn').value='';$('#po').value='';$('#sheet').hidden=false;$('#pn').focus()}
  else if(a==='closesheet')$('#sheet').hidden=true;
  else if(a==='savep'){
    const n=$('#pn').value.trim();if(!n){toast('اكتب اسم المديون');return}
    D.push({id:Date.now().toString(36),name:n,owner:$('#po').value.trim(),tx:[]});
    store();$('#sheet').hidden=true;render();
  }
  else if(a==='debt')addTx('debt');
  else if(a==='pay')addTx('pay');
  else if(a==='edtx'){const x=D.find(p=>p.id===cur).tx[+t.dataset.i];editIdx=+t.dataset.i;$('#ea').value=x.a;$('#en').value=x.n||'';$('#et').value=x.t;$('#esheet').hidden=false}
  else if(a==='closeedit')$('#esheet').hidden=true;
  else if(a==='eoffice'){$('#on').value=O.n;$('#oa').value=O.a;$('#op').value=O.p;$('#osheet').hidden=false}
  else if(a==='closeo')$('#osheet').hidden=true;
  else if(a==='saveo'){const n=$('#on').value.trim();if(!n){toast('اكتب اسم المكتب');return}O={n,a:$('#oa').value.trim(),p:$('#op').value.trim()};storeO();$('#osheet').hidden=true;render();toast('تم تعديل بيانات المكتب')}
  else if(a==='saveedit'){const v=parseFloat($('#ea').value);if(!(v>0)){toast('أدخل مبلغًا صحيحًا');return}const x=D.find(p=>p.id===cur).tx[editIdx];x.a=v;x.n=$('#en').value.trim();x.t=$('#et').value;store();$('#esheet').hidden=true;render();toast('تم تعديل المبلغ')}
  else if(a==='deltx'){if(twice('tx'+t.dataset.i,t,'تأكيد؟')){const p=D.find(x=>x.id===cur);p.tx.splice(+t.dataset.i,1);armed='';store();render()}}
  else if(a==='delp'){if(twice('p',t,'اضغط مرة أخرى لتأكيد الحذف')){D=D.filter(x=>x.id!==cur);cur=null;armed='';store();render()}}
  else if(a==='pdf')exportPDF();
  else if(a==='ppdf')exportPerson();
});

const W=1240,H=1754,F='Tahoma, Arial, sans-serif',PER=18;
function drawPage(rows,pi,np,total,start){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.direction='rtl';g.textBaseline='middle';
  banner(g);
  g.fillStyle='#0b4f4a';g.textAlign='right';g.font='bold 40px '+F;g.fillText('قائمة الديون',W-80,288);
  g.fillStyle='#6b7684';g.textAlign='left';g.font='28px '+F;g.fillText(new Date().toLocaleDateString('en-GB'),80,288);
  const X=[W-80,W-170,W-560,W-900];
  const cut=(s,w)=>{while(g.measureText(s).width>w&&s.length>1)s=s.slice(0,-1);return s};
  g.textAlign='right';g.fillStyle='#e6f2f1';g.fillRect(60,320,W-120,64);
  g.fillStyle='#0b4f4a';g.font='bold 28px '+F;
  ['#','المديون','صاحب الدين','المتبقي'].forEach((h,i)=>g.fillText(h,X[i],352));
  rows.forEach((p,i)=>{
    const y=384+i*64;
    if(i%2)for(let k=0;k<1;k++){g.fillStyle='#f6f8fa';g.fillRect(60,y,W-120,64)}
    g.fillStyle='#1b2430';g.font='28px '+F;
    g.fillText(String(start+i+1),X[0],y+32);
    g.fillText(cut(p.name,370),X[1],y+32);
    g.fillText(cut(p.owner||'—',320),X[2],y+32);
    const b=bal(p);g.fillStyle=b>0?'#c0392b':'#15803d';g.font='bold 28px '+F;
    g.fillText(fmt(b)+' د.ع',X[3],y+32);
  });
  if(pi===np-1){
    const y=384+rows.length*64+30;
    g.fillStyle='#0f766e';g.fillRect(60,y,W-120,76);
    g.fillStyle='#fff';g.font='bold 32px '+F;g.fillText('إجمالي الديون المتبقية: '+fmt(total)+' د.ع',W-90,y+38);
  }
  g.fillStyle='#6b7684';g.font='24px '+F;g.textAlign='center';g.fillText((pi+1)+' / '+np,W/2,H-50);
  const s=c.toDataURL('image/jpeg',0.92).split(',')[1];
  return Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
}
function banner(g){
  const gr=g.createLinearGradient(0,0,W,250);gr.addColorStop(0,'#083f3b');gr.addColorStop(1,'#14907f');
  g.fillStyle=gr;g.fillRect(0,0,W,250);
  g.fillStyle='rgba(255,255,255,.07)';
  [[120,60,150],[330,200,110],[40,230,80]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()});
  g.fillStyle='#d4a537';g.fillRect(0,242,W,8);
  const cx=W-185,cy=122;
  if(LI.complete&&LI.naturalWidth){const lw=270,lh=lw*LI.naturalHeight/LI.naturalWidth;g.drawImage(LI,cx-lw/2,cy-lh/2,lw,lh)}
  g.textAlign='right';
  const x=W-350;
  g.fillStyle='#fff';let fs=68;g.font='bold '+fs+'px '+F;while(g.measureText(O.n).width>W-440&&fs>28){fs-=2;g.font='bold '+fs+'px '+F}g.fillText(O.n,x,92);
  g.fillStyle='#d4a537';g.fillRect(x-160,140,160,5);
  g.fillStyle='rgba(255,255,255,.9)';
  g.font='28px '+F;g.fillText([O.a,O.p].filter(Boolean).join('   |   '),x,196);
}
function drawStatement(p,rows,pi,np,start,sum){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.direction='rtl';g.textBaseline='middle';
  const cut=(s,w)=>{while(g.measureText(s).width>w&&s.length>1)s=s.slice(0,-1);return s};
  banner(g);
  g.fillStyle='#0b4f4a';g.textAlign='right';g.font='bold 40px '+F;g.fillText('كشف حساب',W-80,288);
  g.fillStyle='#6b7684';g.textAlign='left';g.font='28px '+F;g.fillText(new Date().toLocaleDateString('en-GB'),80,288);
  g.textAlign='right';g.fillStyle='#1b2430';g.font='bold 34px '+F;g.fillText(cut('المديون: '+p.name,W-160),W-80,342);
  g.fillStyle='#6b7684';g.font='28px '+F;g.fillText(cut('صاحب الدين: '+(p.owner||'—'),W-160),W-80,388);
  const X=[W-80,W-150,W-370,W-500,W-780,W-1010];
  g.fillStyle='#e6f2f1';g.fillRect(60,416,W-120,64);g.fillStyle='#0b4f4a';g.font='bold 26px '+F;
  ['#','التاريخ','النوع','المبلغ','الرصيد','ملاحظة'].forEach((h,i)=>g.fillText(h,X[i],448));
  rows.forEach((r,i)=>{
    const y=480+i*64;
    if(i%2){g.fillStyle='#f6f8fa';g.fillRect(60,y,W-120,64)}
    g.fillStyle='#1b2430';g.font='26px '+F;
    g.fillText(String(start+i+1),X[0],y+32);g.fillText(r.x.d,X[1],y+32);
    g.fillStyle=r.x.t==='debt'?'#c0392b':'#15803d';g.font='bold 26px '+F;
    g.fillText(r.x.t==='debt'?'دين':'تسديد',X[2],y+32);g.fillText(fmt(r.x.a),X[3],y+32);
    g.fillStyle='#1b2430';g.font='26px '+F;g.fillText(fmt(r.run),X[4],y+32);
    g.fillStyle='#6b7684';g.fillText(cut(r.x.n||'',150),X[5],y+32);
  });
  if(!rows.length){g.fillStyle='#6b7684';g.font='28px '+F;g.textAlign='center';g.fillText('لا توجد حركات',W/2,540)}
  if(pi===np-1){
    const y=480+rows.length*64+30;
    g.textAlign='right';g.fillStyle='#0f766e';g.fillRect(60,y,W-120,110);
    g.fillStyle='#fff';g.font='26px '+F;g.fillText('إجمالي الدين: '+fmt(sum.d)+'   |   المسدد: '+fmt(sum.p),W-90,y+34);
    g.font='bold 36px '+F;g.fillText('المتبقي: '+fmt(sum.d-sum.p)+' د.ع',W-90,y+80);
  }
  g.fillStyle='#6b7684';g.font='24px '+F;g.textAlign='center';g.fillText((pi+1)+' / '+np,W/2,H-50);
  const s=c.toDataURL('image/jpeg',0.92).split(',')[1];
  return Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
}
async function exportPerson(){
  const p=D.find(x=>x.id===cur);if(!p)return;
  const dl=await getDL();
  if(!dl){toast('التصدير غير متاح في هذا العرض');return}
  let run=0;const all=p.tx.map(x=>{run+=x.t==='debt'?x.a:-x.a;return{x,run}});
  const sum={d:p.tx.filter(x=>x.t==='debt').reduce((s,x)=>s+x.a,0),p:p.tx.filter(x=>x.t==='pay').reduce((s,x)=>s+x.a,0)};
  const N=16,np=Math.max(1,Math.ceil(all.length/N)),imgs=[];
  for(let i=0;i<np;i++)imgs.push(drawStatement(p,all.slice(i*N,(i+1)*N),i,np,i*N,sum));
  try{await dl.save({filename:'awwal-deen-statement.pdf',data:buildPDF(imgs)});toast('تم تجهيز الكشف')}
  catch(e){if(!e||e.code!=='declined')toast('تعذر حفظ الملف')}
}
function buildPDF(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;add(id+' 0 obj\n'+body+'\nendobj\n')};
  const n=imgs.length;add('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Count '+n+'/Kids['+imgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
  imgs.forEach((j,i)=>{
    const p=3+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>');
    obj(p+1,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
    offs[p+2]=len;add((p+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+W+'/Height '+H+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.length+'>>\nstream\n');
    add(j);add('\nendstream\nendobj\n');
  });
  const tot=3+3*n,xr=len;
  add('xref\n0 '+tot+'\n0000000000 65535 f \n');
  for(let i=1;i<tot;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  add('trailer\n<</Size '+tot+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

/* حفظ/مشاركة ملف PDF: داخل تطبيق الأندرويد (Capacitor) أو المتصفح */
async function getDL(){
  if(window.claude){try{return await claude.use('downloads')}catch(e){}}
  return {save:async({filename,data})=>{
    const P=window.Capacitor&&Capacitor.Plugins;
    if(P&&P.Filesystem&&P.Share){
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(data)});
      const f=await P.Filesystem.writeFile({path:filename,data:b64,directory:'CACHE'});
      await P.Share.share({title:filename,url:f.uri,dialogTitle:'حفظ أو مشاركة الملف'});
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    }
  }};
}
async function exportPDF(){
  if(!D.length){toast('لا توجد ديون للتصدير');return}
  const dl=await getDL();
  if(!dl){toast('التصدير غير متاح في هذا العرض');return}
  const rows=D.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const total=rows.reduce((s,p)=>s+Math.max(bal(p),0),0);
  const np=Math.ceil(rows.length/PER),imgs=[];
  for(let i=0;i<np;i++)imgs.push(drawPage(rows.slice(i*PER,(i+1)*PER),i,np,total,i*PER));
  try{await dl.save({filename:'awwal-deen-debts.pdf',data:buildPDF(imgs)});toast('تم تجهيز الملف')}
  catch(e){if(!e||e.code!=='declined')toast('تعذر حفظ الملف')}
}
